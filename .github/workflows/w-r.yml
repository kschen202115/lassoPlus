name: w-R-CI

on:
  workflow_dispatch:
    inputs:
      train_num:
        description: 'Enter the value for train_num'
        required: true
        default: '1'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.1'

    - name: Install R packages
      run: |
        Rscript -e 'install.packages(c("MASS","nnet","e1071","randomForest"), repos="https://cran.rstudio.com")'
        Rscript -e 'install.packages("ipred", verbose = TRUE), repos="https://cran.rstudio.com")'
        Rscript -e 'install.packages(c("ggplot2", "ggpubr", "dplyr", "readr", "corrplot", "glmnet", "caret", "CBCgrps", "tidyverse", "rms", "pROC", "readxl", "tableone", "this.path", "parallel", "foreach", "doParallel", "writexl", "doSNOW"), repos="https://cran.rstudio.com")'

    - name: Run R script
      id: Rscript
      run: |
        ls
        Rscript LASSO_plus_parallel.R  ${{ github.event.inputs.train_num }}

    - name: Upload CSV file
      uses: actions/upload-artifact@v3
      with:
        name: result-csv
        path: ./*  # 请将其替换为你的 CSV 文件的实际路径
        


  
